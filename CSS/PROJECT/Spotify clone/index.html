<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spotify - Web Player: Music for You</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
   <link rel="icon" href="./Asssets/logo.png">

</head>

<body>
  <div class="main">
    <div class="sidebar">
      <div class="nav">
        <div class="nav-option">
          <i class="fa-solid fa-house"></i>
          <a href="#">Home</a>
        </div>

        <div class="nav-option">
          <i class="fa-solid fa-magnifying-glass"></i>
          <a href="#">Search</a>
        </div>
      </div>

      <div class="library">
        <div class="options">
          <div class="lib-option nav-option">
            <img src="./Asssets/library_icon.png">
            <a href="#">Your Library</a>
          </div>

          <div class="icons">
            <i class="fa-solid fa-plus"></i>
            <i class="fa-solid fa-arrow-right-long"></i>
          </div>
        </div>

        <div class="lib-boxes">
            <div class="box"></div>
            <p class="box-p1">Create your first playlist</p>
            <p class="box-p2">it`s easy, we`ll help you</p>
            <button class ="badge">Create playlist</button>
        </div>
      </div>
    </div>

    <div class="main-content"></div>
    <div class="music-player"></div>
  </div>
</body>
</html>
