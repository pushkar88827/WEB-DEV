<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>units</title>
    <link rel="stylesheet" href="units.css"  >
</head>
<body>
   <main class="card">
    <h1>Font-size <span>units</span> in CSS</h1>

    <section class="columns">
      <div class="column">
        <h2>Absolute</h2>
        <ul class="absolute">
          <li>px:</li>
          <li>pt</li>
          <li>pc</li>
          <li>cm</li>
          <li>mm</li>
          <li>in</li>
        </ul>
      </div>

      <div class="column">
        <h2>Relative</h2>
        <ul class="relative">
          <li>%</li>
          <li>em</li>
          <li>rem</li>
          <li>ch</li>
          <li>vh</li>
          <li>vw + many more</li>
        </ul>
      </div>
    </section>
    
</body>
</html>
