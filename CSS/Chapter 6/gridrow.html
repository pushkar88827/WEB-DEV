<link rel="stylesheet" href="gridrow.css">
<body>
    <h1>Grid Row</h1>
    <p>If you want to occupy more than one row </p>
    <ol>
        <li>grid-row-start: line no</li>
        <li>grid-row-end: line no</li>


        <li>grid-row:start/End</li>
        
        
    </ol>
    <hr>
    <div class="container">
        <div class="item one">1</div>
        <div class="item two">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
