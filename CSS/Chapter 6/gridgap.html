<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid gap</title>
</head>
<link rel="stylesheet" href="gridgaps.css">
<body>
    <h1>Grid Gaps</h1>
    <p class="point">to make space between rows and colns </p>
    <h2>Representation of GRID GAP</h2>
    <p>
        <ol>
        <li>rowrow-gap: 10px;</li>
        <li>column-gap: 10px;</li>
        <li>grid-gap:10px;</li>
        <li>grid-gap:10px 15px</li>

    </ol>

    </p>
    
    <hr>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
    
</body>
</html>
