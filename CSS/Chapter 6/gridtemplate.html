<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid template</title>
</head>
<link rel="stylesheet" href="gridtemplate.css">
<body>
    <h1 class="heading">
        Grid Template 
    </h1>
    <p>They define the lines & track sizing </p>

    <p class="point">grid-template-rows</p>
    <p class="point">grid-template-columns</p>

    <hr>
    
    <h1> Repeat </h1>
    <p>Repeat is use to divide alll avaliabale space</p>
    <p class="point">
        grid-template-columns:repeat(count,1fr)
        <br>
         grid-template-rows:repeat(count,1fr)
         <br>
          grid-template-columns:1fr 1fr 1fr 1fr  </p>
    <div class="container">

        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

</body>
</html>
