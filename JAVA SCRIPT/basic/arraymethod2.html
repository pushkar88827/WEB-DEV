    <h1>Array Methods 2</h1>

    <h2>indexOf()</h2>
    <p>The indexOf() method returns the position of an element in an array. If the element is not found, it returns -1.</p>

    <h2>includes()</h2>
    <p>The includes() method checks whether an element exists in an array. It returns true if found and false if not found.</p>
